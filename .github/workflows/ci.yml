name: P1 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        # Reviewed release: actions/checkout v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        # Reviewed release: actions/setup-python v7.0.0.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned uv
        # Reviewed release: astral-sh/setup-uv v10.0.1.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --python 3.13 --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run lint
        run: uv run --locked ruff check .
      - name: Run type checks
        run: uv run --locked mypy
      - name: Run non-integration tests
        run: uv run --locked pytest -m "not integration" -ra --tb=short

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUIRE_POSTGRES_INTEGRATION: "1"
    services:
      postgres:
        # Docker Official Image, reviewed tag 16.15-alpine (Alpine 3.24).
        image: postgres:16.15-alpine@sha256:ab5c955e9e57ae9879d4411ab49a912be9d162455676f7bf56e951b11ac73785
        env:
          POSTGRES_USER: seven_lens_ci
          POSTGRES_PASSWORD: p1c3-disposable-only
          POSTGRES_DB: seven_lens_p1
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U seven_lens_ci -d seven_lens_p1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
    steps:
      - name: Check out source
        # Reviewed release: actions/checkout v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        # Reviewed release: actions/setup-python v7.0.0.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned uv
        # Reviewed release: astral-sh/setup-uv v10.0.1.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --python 3.13 --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Assert PostgreSQL server major version
        shell: bash
        run: |
          server_version_num="$(docker exec "${{ job.services.postgres.id }}" \
            psql -U seven_lens_ci -d seven_lens_p1 -Atqc 'SHOW server_version_num')"
          if [[ ! "$server_version_num" =~ ^[0-9]+$ ]]; then
            echo "PostgreSQL integration gate could not read the server version." >&2
            exit 1
          fi
          if (( 10#$server_version_num / 10000 != 16 )); then
            echo "PostgreSQL integration gate requires PostgreSQL major version 16." >&2
            exit 1
          fi
      - name: Run zero-skip PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: >-
            postgresql://seven_lens_ci:p1c3-disposable-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/seven_lens_p1
        # The `live` marker requires real Alpaca Paper credentials from the
        # operator's Keychain and must never run on CI; it is exercised only
        # by the explicit P2-E read-only verification CLI.
        run: uv run --locked pytest tests/integration -m "integration and not live" -ra --tb=short
