name: P1 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        # Reviewed release: actions/checkout v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        # Reviewed release: actions/setup-python v7.0.0.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned uv
        # Reviewed release: astral-sh/setup-uv v10.0.1.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --python 3.13 --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run lint
        run: uv run --locked ruff check .
      - name: Run type checks
        run: uv run --locked mypy
      - name: Run non-integration tests
        run: uv run --locked pytest -m "not integration" -ra --tb=short

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        # Reviewed release: actions/checkout v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        # Reviewed release: actions/setup-python v7.0.0.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned uv
        # Reviewed release: astral-sh/setup-uv v10.0.1.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --python 3.13 --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Run zero-skip PostgreSQL integration tests
        env:
          # Job-local fake password for the repository-owned disposable container.
          SEVEN_LENS_TEST_POSTGRES_PASSWORD: seven-lens-ci-disposable-only
        # The `live` marker requires real Alpaca Paper credentials from the
        # operator's Keychain and must never run on CI; it is exercised only
        # by the explicit P2-E read-only verification CLI.
        run: ./scripts/run_postgres_integration.sh
